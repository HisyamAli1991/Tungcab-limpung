    if (inQuotes){
      if (c === '"'){
        if (line[i+1] === '"'){ cur+='"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delim){ result.push(cur); cur=""; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

function buildMasterFromCSV(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length>0);
  const out = {};
  let total=0, murabahah=0, musyarakah=0, dilewati=0;
  lines.forEach(line=>{
    const r = parseCSVLine(line);
    if (r.length < 18) { dilewati++; return; }
    const produkRaw = (r[4]||"").toUpperCase();
    let produk = null;
    if (produkRaw.includes("MURABAHAH")) produk = "Murabahah";
    else if (produkRaw.includes("MUSYAROKAH") || produkRaw.includes("MUSYARAKAH")) produk = "Musyarakah";
    if (!produk) { return; }
    const denda = (parseFloat(r[16])||0) + (parseFloat(r[17])||0);
    if (denda <= 0) return;
    const rek = (r[0]||"").trim();
    if (!rek) return;
    const tglStr = (r[8]||"").trim();
    const tgl = parseInt((tglStr.split("-")[0]||"0"),10) || 0;
    out[rek] = {
      rek,
      noRekening: rek,
      nama: (r[1]||"").trim(),
      tgl,
      denda: Math.round(denda),
      alamat: (r[15]||"").trim(),
      pendebetan: (r[5]||"").trim(),
      produk
    };
    total++;
    if (produk==="Murabahah") murabahah++; else musyarakah++;
  });
  return { out, total, murabahah, musyarakah };
}

window.handleCSVUpload = (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const text = e.target.result;
      const { out, total, murabahah, musyarakah } = buildMasterFromCSV(text);
      if (total === 0){
        showToast("⚠️ Tidak ada data valid ditemukan di file ini");
        return;
      }
      const ok = confirm(`File ditemukan ${total} debitur menunggak (Murabahah: ${murabahah}, Musyarakah: ${musyarakah}).\n\nGanti data lama dengan data ini? Status kunjungan yang sudah tercatat tetap tersimpan untuk debitur yang sama.`);
      if (!ok) return;
      showToast("⏳ Menyimpan data baru...");
      await set(ref(db,"master_data"), out);
      await set(ref(db,"master_data_meta"), { updatedAt: Date.now(), total, murabahah, musyarakah });
      showToast("✅ Data berhasil diperbarui!");
    } catch(err){
      console.error(err);
      showToast("❌ Gagal membaca file: " + err.message);
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsText(file, "UTF-8");
};

// ====== MIGRASI SATU KALI: kunjungan_murabahah (key: no lama) -> kunjungan_v2 (key: no rekening) ======
async function migrateOldKunjunganIfNeeded(){
  try{
    const flagSnap = await get(ref(db,"meta/migrated_v2"));
    if (flagSnap.exists() && flagSnap.val() === true) return;
    const oldSnap = await get(ref(db,"kunjungan_murabahah"));
    const oldData = oldSnap.val() || {};
    const updates = {};
    Object.keys(oldData).forEach(oldNo=>{
      const rek = OLD_NO_TO_REK[oldNo];
      if (!rek) return;
      updates[`kunjungan_v2/${rek}`] = oldData[oldNo];
    });
    if (Object.keys(updates).length){
      await update(ref(db), updates);
    }
    await set(ref(db,"meta/migrated_v2"), true);
  } catch(err){
    console.error("Migrasi gagal:", err);
  }
}

// ====== FIREBASE LISTENERS ======
async function initMasterData(){
  const snap = await get(ref(db,"master_data"));
  if (!snap.exists() || !snap.val() || Object.keys(snap.val()).length===0){
    // Belum ada data di Firebase -> seed dengan data bawaan (hasil CSV terakhir yang di-embed)
    const seedObj = {};
    SEED_DATA.forEach(d=>{ seedObj[d.rek] = {...d, noRekening: d.rek}; });
    await set(ref(db,"master_data"), seedObj);
    await set(ref(db,"master_data_meta"), { updatedAt: Date.now(), total: SEED_DATA.length, seeded:true });
  }
}

const buildFilters = () => {
  const row = document.getElementById("filter-row");
  const options = ["Semua",...STATUS_LABELS];
  row.innerHTML = options.map(s=>`
    <button class="filter-btn${filterStatus===s?" active":""}" onclick="setFilter('${s}')">${s}</button>
  `).join("");
};

const buildProdukFilters = () => {
  const row = document.getElementById("filter-produk-row");
  const options = ["Semua","Murabahah","Musyarakah"];
  row.innerHTML = options.map(p=>`
    <button class="filter-btn${filterProduk===p?" active":""}" onclick="setProdukFilter('${p}')">${p}</button>
  `).join("");
};

window.setProdukFilter = (p) => { filterProduk=p; buildProdukFilters(); renderList(); };
window.setFilter = (s) => { filterStatus=s; buildFilters(); renderList(); };

const renderList = () => {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = DATA.filter(d=>{
    const matchQ = !q||d.nama.toLowerCase().includes(q)||d.noRekening.includes(q)||d.alamat.toLowerCase().includes(q);
    const matchProduk = filterProduk==="Semua"||d.produk===filterProduk;
    const s = (fbData[d.rek]?.status)||0;
    const label = STATUS_LABELS[s];
    const matchS = filterStatus==="Semua"||label===filterStatus;
    return matchQ&&matchProduk&&matchS;
  });
  document.getElementById("result-count").textContent = `${filtered.length} debitur ditemukan`;
  document.getElementById("list-container").innerHTML = filtered.map(d=>{
    const s = (fbData[d.rek]?.status)||0;
    const produkClass = d.produk==="Murabahah"?"produk-mura":"produk-mush";
    const ekor = d.noRekening.slice(-4);
    return `
    <div class="debitur-card status-${s}" onclick="openModal('${d.rek}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="nomor-badge">#${ekor}</span>
            <span style="font-weight:700;font-size:14px">${d.nama}</span>
            <span class="produk-badge ${produkClass}">${d.produk}</span>
          </div>
          <div style="font-size:11px;color:#94a3b8;margin-top:3px">${d.noRekening}</div>
          <div style="font-size:12.5px;color:#334155;margin-top:4px;line-height:1.45;font-weight:500">📍 ${d.alamat}</div>
          ${fbData[d.rek]?.catatan?`<div style="font-size:11px;color:#2563eb;margin-top:4px">📝 ${fbData[d.rek].catatan}</div>`:""}
        </div>
        <div style="text-align:right;margin-left:10px;flex-shrink:0">
          <div style="color:#dc2626;font-weight:700;font-size:13px">${rp(d.denda)}</div>
          <div style="font-size:10px;color:#94a3b8">tgl ${d.tgl}</div>
          <div class="badge badge-${s}" style="margin-top:4px;display:inline-block">${STATUS_LABELS[s]}</div>
        </div>
      </div>
    </div>`;
  }).join("") || `<div style="text-align:center;padding:40px;color:#94a3b8">Tidak ada data</div>`;
};

const renderRekap = () => {
  document.getElementById("r-total").textContent = DATA.length;
  const byProduk = {};
  ["Murabahah","Musyarakah"].forEach(p => {
    const subset = DATA.filter(d=>d.produk===p);
    const counts = [0,0,0,0];
    subset.forEach(d=>{ const s=(fbData[d.rek]?.status)||0; counts[s]++; });
    const sudahBayar = subset.filter(d=>(fbData[d.rek]?.status)===3).reduce((a,d)=>a+d.denda,0);
    const totalDenda = subset.reduce((a,d)=>a+d.denda,0);
    byProduk[p] = {counts, sudahBayar, totalDenda, jumlah:subset.length};
  });

  const totalMura = byProduk.Murabahah.totalDenda;
  const totalMush = byProduk.Musyarakah.totalDenda;
  const terkumpulMura = byProduk.Murabahah.sudahBayar;
  const terkumpulMush = byProduk.Musyarakah.sudahBayar;

  document.getElementById("r-denda").textContent = rp(totalMura+totalMush);
  document.getElementById("r-terkumpul").textContent = rp(terkumpulMura+terkumpulMush);

  let html = "";
  ["Murabahah","Musyarakah"].forEach(p => {
    const {counts, jumlah} = byProduk[p];
    html += `<div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:8px">${p}</div>`;
    STATUS_LABELS.forEach((s,i)=>{
      html += `<div style="display:flex;align-items:center;margin-bottom:8px">
        <div style="flex:1">
          <div style="font-size:12px;font-weight:600">${s}</div>
          <div class="progress-bar" style="background:${STATUS_BG[i]};width:${Math.round(counts[i]/(jumlah||1)*100)||0}%"></div>
        </div>
        <div style="font-weight:700;font-size:16px;margin-left:12px;color:${STATUS_FG[i]};min-width:32px;text-align:right">${counts[i]}</div>
      </div>`;
    });
    html += "</div>";
  });
  document.getElementById("rekap-status").innerHTML = html;
};

window.openModal = (rek) => {
  currentRek = rek;
  const d = DATA.find(x=>x.rek===rek);
  if (!d) return;
  document.getElementById("m-nama").textContent = d.nama;
  document.getElementById("m-rek").textContent = d.noRekening;
  document.getElementById("m-denda").textContent = rp(d.denda);
  document.getElementById("m-alamat").textContent = d.alamat;
  document.getElementById("m-tgl").textContent = d.tgl;
  document.getElementById("m-pendebetan").textContent = d.pendebetan;
  document.getElementById("m-catatan").value = fbData[rek]?.catatan||"";
  updateModalStatus();
  const upd = fbData[rek]?.updatedAt;
  document.getElementById("m-updated").textContent = upd ? `Update terakhir: ${new Date(upd).toLocaleString("id-ID")}` : "";
  document.getElementById("modal").classList.add("open");
};

const updateModalStatus = () => {
  const s = (fbData[currentRek]?.status)||0;
  document.getElementById("status-grid").innerHTML = STATUS_LABELS.map((label,i)=>`
    <button class="status-btn${s===i?" active-"+i:""}" onclick="setStatusModal(${i})">${label}</button>
  `).join("");
};

window.setStatusModal = (val) => {
  if(!fbData[currentRek]) fbData[currentRek]={};
  fbData[currentRek].status = val;
  updateModalStatus();
};

window.closeModal = (e) => {
  if(e.target.id==="modal") { currentRek=null; document.getElementById("modal").classList.remove("open"); }
};

window.saveAndClose = async () => {
  const s = (fbData[currentRek]?.status)||0;
  const catatan = document.getElementById("m-catatan").value;
  await update(ref(db,`kunjungan_v2/${currentRek}`),{
    status: s,
    catatan: catatan,
    updatedAt: Date.now(),
  });
  showToast("✅ Tersimpan!");
  currentRek=null;
  document.getElementById("modal").classList.remove("open");
};

const showToast = (msg) => {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
};

window.switchTab = (tab) => {
  activeTab = tab;
  document.getElementById("tab-daftar").style.display = tab==="daftar"?"block":"none";
  document.getElementById("tab-rekap").style.display = tab==="rekap"?"block":"none";
  document.querySelectorAll(".tab").forEach((t,i)=>{
    t.classList.toggle("active", (i===0&&tab==="daftar")||(i===1&&tab==="rekap"));
  });
  if(tab==="rekap") renderRekap();
};

// ====== INIT ======
buildProdukFilters();
buildFilters();
document.getElementById("search").addEventListener("input", renderList);
renderList();
renderRekap();

// Pasang listener Firebase LANGSUNG (tidak menunggu proses lain) supaya status
// koneksi & data selalu jalan walaupun proses migrasi/seed di bawah gagal/lambat.
let gotMasterOnce = false;
let gotKunjunganOnce = false;

const connectionTimeout = setTimeout(()=>{
  if (!gotMasterOnce || !gotKunjunganOnce){
    document.getElementById("sync-status").textContent = "⚠️ Gagal terhubung ke server, cek koneksi internet";
  }
}, 8000);

onValue(ref(db,"master_data"), (snap) => {
  gotMasterOnce = true;
  const obj = snap.val() || {};
  if (Object.keys(obj).length > 0){
    DATA = Object.values(obj);
  }
  renderList();
  if (activeTab==="rekap") renderRekap();
}, (err) => {
  console.error("master_data error:", err);
  document.getElementById("sync-status").textContent = "⚠️ Tidak bisa baca data (cek aturan Firebase)";
});

onValue(ref(db,"master_data_meta"), (snap) => {
  const meta = snap.val();
  if (meta && meta.updatedAt){
    document.getElementById("update-info").textContent =
      `Data per: ${new Date(meta.updatedAt).toLocaleString("id-ID")} · ${meta.total||""} debitur`;
  }
});

onValue(ref(db,"kunjungan_v2"), (snap) => {
  gotKunjunganOnce = true;
  clearTimeout(connectionTimeout);
  fbData = snap.val() || {};
  document.getElementById("sync-status").textContent = "Terhubung · Realtime";
  renderList();
  if (activeTab==="rekap") renderRekap();
  if (currentRek) updateModalStatus();
}, (err) => {
  console.error("kunjungan_v2 error:", err);
  document.getElementById("sync-status").textContent = "⚠️ Tidak bisa terhubung (cek aturan Firebase)";
});

// Migrasi & seeding data bawaan berjalan di belakang layar, tidak menghalangi tampilan di atas.
(async () => {
  try { await migrateOldKunjunganIfNeeded(); } catch(e){ console.error(e); }
  try { await initMasterData(); } catch(e){ console.error(e); }
})();
</script>
