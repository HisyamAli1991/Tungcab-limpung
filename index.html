<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Nasabah — KOPENA Limpung</title>
<style>
  :root{
    --ink:#1c2b2a;
    --ink-soft:#4a5a58;
    --paper:#f6f4ee;
    --paper-raised:#ffffff;
    --line:#dcd6c8;
    --brand:#0f4d43;
    --brand-soft:#e4ede9;
    --paid-bg:#e7f4e9;
    --paid-line:#2f8f52;
    --paid-text:#1f6b3a;
    --unpaid-line:#d8d1bd;
    --amber:#b5842a;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .nums{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  header.top{
    position:sticky; top:0; z-index:10;
    background:var(--brand);
    color:#f3efe4;
    padding:18px 16px 14px;
  }
  header.top h1{
    margin:0 0 2px;
    font-size:1.15rem;
    font-weight:700;
    letter-spacing:0.01em;
  }
  header.top p{
    margin:0 0 14px;
    font-size:0.8rem;
    color:#cfe0d8;
  }
  .search-wrap{position:relative;}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    opacity:0.55;
  }
  #search{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:999px;
    border:none;
    font-size:0.95rem;
    background:#f3efe4;
    color:var(--ink);
    outline:none;
  }
  #search::placeholder{color:#8a8578;}

  .stats{
    display:flex; gap:8px;
    padding:12px 16px 4px;
    overflow-x:auto;
  }
  .stat{
    flex:1;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 12px;
    min-width:96px;
    cursor:pointer;
    user-select:none;
    transition:border-color 0.12s, transform 0.08s;
  }
  .stat:active{transform:scale(0.97);}
  .stat b{display:block; font-size:1.25rem; line-height:1.1;}
  .stat span{font-size:0.7rem; color:var(--ink-soft);}
  .stat.paid b{color:var(--paid-text);}
  .stat.active{
    border-color:var(--brand);
    border-width:2px;
    background:var(--brand-soft);
  }
  .stat.paid.active{
    border-color:var(--paid-line);
    background:var(--paid-bg);
  }

  .filters{
    display:flex; gap:6px;
    padding:10px 16px 2px;
    overflow-x:auto;
  }
  .chip{
    flex:0 0 auto;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    font-size:0.78rem;
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{
    background:var(--brand);
    border-color:var(--brand);
    color:#fff;
  }

  .ao-filter-row{
    padding:2px 16px 8px;
  }
  #aoFilter{
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    font-size:0.82rem;
    font-family:inherit;
  }

  main{padding:8px 16px 90px;}
  .count-row{
    font-size:0.78rem;
    color:var(--ink-soft);
    padding:8px 2px 6px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--unpaid-line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .card.paid{
    background:var(--paid-bg);
    border-left-color:var(--paid-line);
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  }
  .card-name{font-weight:700; font-size:0.98rem;}
  .card-rek{font-size:0.72rem; color:var(--ink-soft);}
  .card-mid{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:6px; gap:8px;
  }
  .badge{
    font-size:0.68rem;
    padding:3px 8px;
    border-radius:999px;
    background:var(--brand-soft);
    color:var(--brand);
    white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:62%;
  }
  .card.paid .badge{
    background:#d3ead9;
    color:var(--paid-text);
  }
  .status-tag{
    font-size:0.68rem;
    font-weight:600;
    color:var(--amber);
  }
  .card.paid .status-tag{color:var(--paid-text);}
  .card-bottom{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin-top:6px;
    font-size:0.78rem;
  }
  .card-bottom .col-outstanding{text-align:center;}
  .card-bottom .col-angsuran{text-align:right;}
  .card-bottom .lbl{color:var(--ink-soft); font-size:0.68rem; display:block;}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 12px;
    font-size:0.88rem;
  }

  /* Detail overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,26,25,0.5);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:0 0 24px;
    animation:up 0.18s ease-out;
  }
  @keyframes up{from{transform:translateY(24px); opacity:0.4} to{transform:translateY(0); opacity:1}}
  .sheet-head{
    position:sticky; top:0;
    background:var(--brand);
    color:#f3efe4;
    padding:16px;
    border-radius:18px 18px 0 0;
  }
  .sheet-head .close{
    position:absolute; right:14px; top:14px;
    background:rgba(255,255,255,0.15);
    border:none; color:#fff;
    width:28px; height:28px; border-radius:50%;
    font-size:1rem; line-height:1;
    cursor:pointer;
  }
  .sheet-head h2{margin:0 18px 2px 0; font-size:1.1rem;}
  .sheet-head .sub{font-size:0.75rem; color:#cfe0d8;}
  .status-banner{
    margin:14px 16px 0;
    padding:9px 12px;
    border-radius:8px;
    font-size:0.8rem;
    font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .status-banner.paid{background:var(--paid-bg); color:var(--paid-text); border:1px solid var(--paid-line);}
  .status-banner.unpaid{background:#fbf1de; color:var(--amber); border:1px solid #e7cf9c;}

  .section{margin:16px 16px 0;}
  .section h3{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .field{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
  }
  .field.full{grid-column:1/-1;}
  .field .lbl{display:block; font-size:0.68rem; color:var(--ink-soft); margin-bottom:2px;}
  .field .val{font-size:0.88rem; font-weight:600; word-break:break-word;}
  .field .val.big{font-size:1.05rem;}
  .field.paid-field{background:var(--paid-bg); border-color:var(--paid-line);}
  .field.paid-field .val{color:var(--paid-text);}

  .upload-row{
    display:flex; align-items:center; gap:8px;
    margin-top:10px; flex-wrap:wrap;
  }
  .upload-btn, .reset-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.75rem; font-weight:600;
    padding:7px 12px; border-radius:999px;
    border:1px solid rgba(243,239,228,0.35);
    background:rgba(243,239,228,0.08);
    color:#f3efe4;
    cursor:pointer;
    user-select:none;
  }
  .upload-btn:hover, .reset-btn:hover{background:rgba(243,239,228,0.18);}
  .reset-btn{background:transparent;}
  .upload-status{
    font-size:0.72rem;
    color:#cfe0d8;
  }
  .upload-status.err{color:#f3c6c6;}
  .upload-status.ok{color:#c9ecd2;}

  .action-row{
    display:flex; align-items:center; gap:8px;
    margin-top:8px; flex-wrap:wrap;
  }
  .action-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.75rem; font-weight:600;
    padding:7px 12px; border-radius:999px;
    border:1px solid rgba(243,239,228,0.35);
    background:rgba(243,239,228,0.08);
    color:#f3efe4;
    cursor:pointer;
    user-select:none;
  }
  .action-btn:hover{background:rgba(243,239,228,0.18);}

  /* Compare sheet */
  .compare-upload{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .compare-upload label.file-lbl{
    display:block; font-size:0.68rem; color:var(--ink-soft); margin-bottom:4px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .compare-upload input[type=file]{
    width:100%; font-size:0.78rem;
  }
  .compare-filename{font-size:0.72rem; color:var(--ink-soft); margin-top:4px;}
  .compare-run-btn{
    width:100%;
    padding:11px;
    border-radius:999px;
    border:none;
    background:var(--brand);
    color:#fff;
    font-weight:700;
    font-size:0.88rem;
    cursor:pointer;
    margin-top:4px;
  }
  .compare-run-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .compare-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:12px 0;
  }
  .compare-stat{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    text-align:center;
  }
  .compare-stat b{display:block; font-size:1.2rem;}
  .compare-stat span{font-size:0.68rem; color:var(--ink-soft);}
  .compare-stat.down b{color:#b5482a;}
  .compare-stat.up b{color:var(--paid-text);}
  .compare-group-title{
    font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); margin:14px 2px 6px;
  }
  .compare-item{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--unpaid-line);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:6px;
    font-size:0.85rem;
  }
  .compare-item.down{border-left-color:#c24a30;}
  .compare-item.up{border-left-color:var(--paid-line);}
  .compare-item .nm{font-weight:700;}
  .compare-item .rek{font-size:0.7rem; color:var(--ink-soft);}
  .compare-empty{font-size:0.8rem; color:var(--ink-soft); padding:4px 2px 10px;}
  .compare-status{font-size:0.78rem; color:var(--ink-soft); margin-top:6px;}
  .compare-status.err{color:#c24a30;}

  /* Print / export PDF */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block !important;
      position:absolute; left:0; top:0; width:100%;
      padding:0; margin:0; background:#fff; color:#000;
    }
    #printArea h1{font-size:14pt; margin:0 0 2px;}
    #printArea .print-sub{font-size:9pt; color:#333; margin:0 0 10px;}
    #printArea table{width:100%; border-collapse:collapse; font-size:8pt;}
    #printArea th, #printArea td{border:1px solid #999; padding:3px 5px; text-align:left;}
    #printArea th{background:#eee;}
    #printArea td.num{text-align:right; white-space:nowrap;}
    #printArea tr.paid td{background:#f0f7f1;}
  }
</style>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TungCab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>

<header class="top">
  <h1>Data Nasabah — KOPENA Limpung</h1>
  <p id="subtitle">328 rekening &middot; cari nama, nomor rekening, atau alamat</p>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8578" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Cari nasabah..." autocomplete="off">
  </div>
  <div class="upload-row">
    <button id="uploadBtn" class="upload-btn" type="button">⭱ Upload CSV/XLS terbaru</button>
    <input id="csvFile" type="file" accept=".csv,.txt,.xls,.xlsx,.xml" style="display:none">
    <button id="resetBtn" class="reset-btn" type="button">Reset ke data bawaan</button>
    <button id="syncBtn" class="reset-btn" type="button">⟳ Sinkronkan dari server</button>
    <span id="uploadStatus" class="upload-status"></span>
  </div>
  <div class="action-row">
    <button id="compareBtn" class="action-btn" type="button">⇄ Bandingkan 2 file</button>
    <button id="exportPdfBtn" class="action-btn" type="button">🖨 Export PDF</button>
  </div>
</header>

<div class="overlay" id="compareOverlay">
  <div class="sheet" id="compareSheet"></div>
</div>

<div id="printArea"></div>

<div class="stats">
  <div class="stat active" id="cardTotal" data-status="all"><b id="statTotal">0</b><span>Total nasabah</span></div>
  <div class="stat paid" id="cardPaid" data-status="paid"><b id="statPaid">0</b><span>Sudah angsur</span></div>
  <div class="stat" id="cardUnpaid" data-status="unpaid"><b id="statUnpaid">0</b><span>Belum angsur</span></div>
</div>

<div class="filters" id="filters"></div>

<div class="ao-filter-row">
  <select id="aoFilter"><option value="Semua">Semua AO</option></select>
</div>

<main>
  <div class="count-row" id="countRow"></div>
  <div id="list"></div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>

const STORAGE_KEY = 'kopena_limpung_data_v1';
const STORAGE_META_KEY = 'kopena_limpung_data_meta_v1';
let DATA = DEFAULT_DATA;
try{
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) DATA = JSON.parse(saved);
}catch(e){ console.warn('Gagal memuat data tersimpan, memakai data bawaan.', e); }

/* ==== Sinkronisasi dengan Google Sheets (via Google Apps Script) ====
   1. Buat Google Sheet + deploy Apps Script (lihat file Code.gs).
   2. Tempel URL Web App hasil deploy di bawah ini, di antara tanda kutip.
   Jika dikosongkan, aplikasi tetap jalan seperti biasa memakai data lokal HP ini saja. */
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwkK44P8Alh3Q6VQC4_UsREWWmqsFTHoxc4bC6UjWUqtS2squXoCoxQlF8_jpxKWJ8r/exec';
/* Kunci ini HARUS sama persis dengan API_SECRET_KEY di Code.gs (Apps Script). */
const API_SECRET_KEY = '12cc24460413dcf085c944540610c472df8d3c4441fca84d';

function setMeta(updatedAt, source){
  try{
    localStorage.setItem(STORAGE_META_KEY, JSON.stringify({updatedAt, source}));
  }catch(e){}
}

async function loadFromServer(silent){
  if(!SHEET_API_URL) return;
  const statusEl = document.getElementById('uploadStatus');
  if(!silent && statusEl){
    statusEl.textContent = 'Mengambil data terbaru dari server...';
    statusEl.className = 'upload-status';
  }
  try{
    const res = await fetch(SHEET_API_URL + '?key=' + encodeURIComponent(API_SECRET_KEY), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const records = await res.json();
    if(!Array.isArray(records)) throw new Error('Format data dari server tidak dikenali.');
    DATA = records;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
    const now = new Date();
    const updatedAt = now.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) +
      ' ' + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    setMeta(updatedAt, 'server');
    updateStats();
    rebuildFilters();
    rebuildAOFilter();
    render();
    if(statusEl){
      statusEl.textContent = `✓ ${records.length} rekening dimuat dari server`;
      statusEl.className = 'upload-status ok';
    }
  }catch(err){
    console.warn('Gagal sinkron dari server, memakai data lokal.', err);
    if(!silent && statusEl){
      statusEl.textContent = 'Gagal mengambil data dari server: ' + err.message;
      statusEl.className = 'upload-status err';
    }
  }
}

async function saveToServer(records){
  if(!SHEET_API_URL) return;
  const statusEl = document.getElementById('uploadStatus');
  try{
    await fetch(SHEET_API_URL, {
      method: 'POST',
      body: JSON.stringify({records, key: API_SECRET_KEY})
    });
    if(statusEl) statusEl.textContent += ' · tersimpan ke server';
  }catch(err){
    console.warn('Gagal menyimpan ke server.', err);
    if(statusEl) statusEl.textContent += ' · GAGAL simpan ke server (cek koneksi)';
  }
}

function fmtRupiah(n){
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Math.round(n));
  return sign + 'Rp' + abs.toLocaleString('id-ID');
}

function shortProduk(p){
  return p.replace('PEMBIAYAAN','PBY').replace('PEMBY.','PBY').replace('MURABAHAH','MRBH')
          .replace('MUSYAROKAH','MSY').replace('MANASUKA','').trim();
}

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const countRow = document.getElementById('countRow');
const filtersEl = document.getElementById('filters');

let activeProduk = 'Semua';

function rebuildFilters(){
  const produkList = ['Semua', ...new Set(DATA.map(d => d.produk))];
  if(!produkList.includes(activeProduk)) activeProduk = 'Semua';
  filtersEl.innerHTML = produkList.map((p,i) =>
    `<div class="chip ${p===activeProduk?'active':''}" data-p="${p}">${p==='Semua'?'Semua':shortProduk(p)}</div>`
  ).join('');
}
rebuildFilters();

filtersEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  activeProduk = chip.dataset.p;
  [...filtersEl.children].forEach(c => c.classList.toggle('active', c === chip));
  render();
});

let activeAO = 'Semua';
const aoFilterEl = document.getElementById('aoFilter');

function rebuildAOFilter(){
  const aos = [...new Set(DATA.map(d => (d.ao || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'id'));
  if(activeAO !== 'Semua' && !aos.includes(activeAO)) activeAO = 'Semua';
  aoFilterEl.innerHTML = `<option value="Semua">Semua AO (${DATA.length})</option>` +
    aos.map(a => {
      const cnt = DATA.filter(d => (d.ao || '').trim() === a).length;
      return `<option value="${a}" ${a === activeAO ? 'selected' : ''}>${a} (${cnt})</option>`;
    }).join('');
}
rebuildAOFilter();

aoFilterEl.addEventListener('change', () => {
  activeAO = aoFilterEl.value;
  render();
});

function updateStats(){
  document.getElementById('statTotal').textContent = DATA.length;
  document.getElementById('statPaid').textContent = DATA.filter(d => d.sudah_angsur).length;
  document.getElementById('statUnpaid').textContent = DATA.filter(d => !d.sudah_angsur).length;
  const sub = document.getElementById('subtitle');
  let metaTxt = '';
  try{
    const meta = JSON.parse(localStorage.getItem(STORAGE_META_KEY) || 'null');
    if(meta && meta.updatedAt) metaTxt = ` · diperbarui ${meta.updatedAt}`;
  }catch(e){}
  sub.textContent = `${DATA.length} rekening · cari nama, nomor rekening, atau alamat${metaTxt}`;
}
updateStats();

let activeStatus = 'all';
const statCards = document.querySelectorAll('.stat[data-status]');
statCards.forEach(card => {
  card.addEventListener('click', () => {
    activeStatus = card.dataset.status;
    statCards.forEach(c => c.classList.toggle('active', c === card));
    render();
  });
});

function matches(d, q){
  if(!q) return true;
  q = q.toLowerCase();
  return d.nama.toLowerCase().includes(q) ||
         d.no_rekening.toLowerCase().includes(q) ||
         d.alamat.toLowerCase().includes(q) ||
         d.no_akad.toLowerCase().includes(q) ||
         d.ao.toLowerCase().includes(q);
}

function getFilteredRows(){
  const q = searchEl.value.trim();
  let rows = DATA.filter(d => matches(d, q));
  if(activeProduk !== 'Semua') rows = rows.filter(d => d.produk === activeProduk);
  if(activeAO !== 'Semua') rows = rows.filter(d => (d.ao || '').trim() === activeAO);
  if(activeStatus === 'paid') rows = rows.filter(d => d.sudah_angsur);
  if(activeStatus === 'unpaid') rows = rows.filter(d => !d.sudah_angsur);
  return rows;
}

function render(){
  const rows = getFilteredRows();

  const statusLabel = activeStatus === 'paid' ? ' · sudah angsur' : activeStatus === 'unpaid' ? ' · belum angsur' : '';
  const aoLabel = activeAO !== 'Semua' ? ` · AO: ${activeAO}` : '';
  countRow.textContent = `Menampilkan ${rows.length} dari ${DATA.length} nasabah${statusLabel}${aoLabel}`;

  if(rows.length === 0){
    listEl.innerHTML = `<div class="empty">Tidak ada nasabah yang cocok dengan pencarian.</div>`;
    return;
  }

  listEl.innerHTML = rows.map((d, idx) => {
    const realIdx = DATA.indexOf(d);
    return `
    <div class="card ${d.sudah_angsur ? 'paid' : ''}" data-idx="${realIdx}">
      <div class="card-top">
        <div class="card-name">${d.nama}</div>
        <div class="card-rek nums">${d.no_rekening}</div>
      </div>
      <div class="card-mid">
        <div class="badge">${shortProduk(d.produk)}</div>
        <div class="status-tag">${d.sudah_angsur ? '✓ Sudah angsur' : 'Belum angsur'}</div>
      </div>
      <div class="card-bottom">
        <div>
          <span class="lbl">Sisa pokok</span>
          <span class="nums">${fmtRupiah(d.sisa_pokok_akhir)}</span>
        </div>
        <div class="col-outstanding">
          <span class="lbl">Outstanding</span>
          <span class="nums">${fmtRupiah(d.saldo)}</span>
        </div>
        <div class="col-angsuran">
          <span class="lbl">Angsuran/bulan</span>
          <span class="nums">${fmtRupiah(d.angsuran_bulanan)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ==== Import data dari CSV (format sama seperti export inti/core banking) ==== */

function parseCSVLine(line){
  const out = [];
  let cur = '';
  let inQuotes = false;
  for(let i=0; i<line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ';'){ out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function toNum(v){
  const n = parseFloat((v || '0').toString().trim());
  return isNaN(n) ? 0 : n;
}

function toDate(v){
  return (v || '').toString().trim().split(' ')[0];
}

/* ==== Import data dari Excel XML (SpreadsheetML), format laporan "TAGIHAN MITRA USAHA" .XLS ==== */

function isExcelXml(text){
  const head = text.slice(0, 1000);
  return /<\?xml/i.test(head) && /schemas-microsoft-com:office:spreadsheet/i.test(text.slice(0, 3000));
}

function decodeXmlEntities(s){
  return (s || '')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&#(\d+);/g, (m, d) => String.fromCharCode(parseInt(d, 10)))
    .replace(/&amp;/g, '&');
}

function xlsXmlToRecords(text){
  const records = [];
  let cabang = '';
  const kantorMatch = text.match(/Keseluruhan Kantor\s*:\s*\d+\s*\/\s*([^<]+?)(?:<|\s{2,})/i);
  if(kantorMatch) cabang = decodeXmlEntities(kantorMatch[1]).trim();

  let currentProduk = '';
  let currentKodeProduk = '';

  const rowRe = /<Row[^>]*>([\s\S]*?)<\/Row>/g;
  const dataRe = /<Data[^>]*>([\s\S]*?)<\/Data>/g;
  let rowMatch;
  while((rowMatch = rowRe.exec(text)) !== null){
    const rowContent = rowMatch[1];
    const cells = [];
    let dm;
    dataRe.lastIndex = 0;
    while((dm = dataRe.exec(rowContent)) !== null){
      cells.push(decodeXmlEntities(dm[1]).trim());
    }
    if(cells.length === 0) continue;

    const sectionMatch = cells[0].match(/^(\d{3})\s*\/\s*(.+)$/);
    if(sectionMatch){
      currentKodeProduk = sectionMatch[1];
      currentProduk = sectionMatch[2].trim();
      continue;
    }
    if(cells[0].indexOf('T O T A L') !== -1) continue;
    if(!/^\d+$/.test(cells[0])) continue; // baris bukan data rekening (header, dsb)
    if(cells.length < 17) continue;

    const no_rekening = cells[0];
    const nama = cells[1];
    const plafon = toNum(cells[2]);
    const sisa_pokok_akhir = toNum(cells[4]);
    const angsuran_bulanan = toNum(cells[9]);
    const pembayaran_pokok = toNum(cells[10]);
    const pembayaran_margin = toNum(cells[11]);
    const tunggakan_akhir_pokok = toNum(cells[12]);
    const tunggakan_akhir_margin = toNum(cells[13]);
    const tgl_jatuh_tempo = toDate(cells[15]);
    const ao = cells[16];
    const kode_tipe = currentKodeProduk.startsWith('1') ? '1' : '5';

    records.push({
      no_rekening,
      nama,
      plafon,
      saldo: toNum(cells[3]),
      produk: currentProduk,
      no_rekening_terkait: '',
      nama_terkait: '',
      no_akad: '',
      tgl_mulai: '',
      tgl_jatuh_tempo,
      kode_tipe,
      margin_rate: 0,
      ao,
      angsuran_bulanan,
      alamat: '',
      sisa_pokok: sisa_pokok_akhir,
      pembayaran_pokok,
      pembayaran_margin,
      sisa_pokok_akhir,
      sisa_total_akhir: tunggakan_akhir_pokok + tunggakan_akhir_margin,
      cabang,
      kode_ao: '',
      kode_produk: currentKodeProduk,
      saldo_pokok_net: tunggakan_akhir_pokok,
      saldo_total_net: tunggakan_akhir_pokok + tunggakan_akhir_margin,
      sudah_angsur: (pembayaran_pokok > 0 || pembayaran_margin > 0)
    });
  }
  return records;
}

function csvToRecords(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim().length > 0);
  const records = [];
  for(const line of lines){
    const f = parseCSVLine(line);
    if(f.length < 32) continue; // baris tidak sesuai format, lewati
    const pembayaran_pokok = toNum(f[21]);
    records.push({
      no_rekening: (f[0]||'').trim(),
      nama: (f[1]||'').trim(),
      plafon: toNum(f[2]),
      saldo: toNum(f[3]),
      produk: (f[4]||'').trim(),
      no_rekening_terkait: (f[5]||'').trim(),
      nama_terkait: (f[6]||'').trim(),
      no_akad: (f[7]||'').trim(),
      tgl_mulai: toDate(f[8]),
      tgl_jatuh_tempo: toDate(f[9]),
      kode_tipe: (f[10]||'').trim(),
      margin_rate: toNum(f[11]),
      ao: (f[12]||'').trim(),
      angsuran_bulanan: toNum(f[19]),
      alamat: (f[15]||'').trim(),
      sisa_pokok: toNum(f[16]),
      pembayaran_pokok: pembayaran_pokok,
      pembayaran_margin: toNum(f[22]),
      sisa_pokok_akhir: toNum(f[24]),
      sisa_total_akhir: toNum(f[25]),
      cabang: (f[26]||'').trim(),
      kode_ao: (f[28]||'').trim(),
      kode_produk: (f[29]||'').trim(),
      saldo_pokok_net: toNum(f[30]),
      saldo_total_net: toNum(f[31]),
      sudah_angsur: pembayaran_pokok > 0
    });
  }
  return records;
}

/* ==== Proteksi password untuk aksi sensitif (Upload, Reset, Bandingkan) ====
   Password TIDAK ditulis polos di kode, hanya hash SHA-256-nya yang disimpan.
   Ini proteksi ringan (mencegah pengguna iseng), bukan keamanan tingkat tinggi -
   karena ini file statis, siapa pun yang paham teknis tetap bisa membaca kode sumbernya.
   Untuk ganti password: hitung SHA-256 dari password baru lalu ganti nilai ADMIN_PASSWORD_HASH. */
const ADMIN_PASSWORD_HASH = '888df25ae35772424a560c7152a1de794440e0ea5cfee62828333a456a506e05';

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

let passwordVerifiedUntil = 0; // timestamp; sekali benar, tidak perlu isi ulang selama beberapa menit
const PASSWORD_GRACE_MS = 10 * 60 * 1000; // 10 menit

async function requirePassword(){
  if(Date.now() < passwordVerifiedUntil) return true;
  const input = prompt('Masukkan password untuk melanjutkan:');
  if(input === null) return false; // dibatalkan
  const hash = await sha256Hex(input);
  if(hash === ADMIN_PASSWORD_HASH){
    passwordVerifiedUntil = Date.now() + PASSWORD_GRACE_MS;
    return true;
  }
  alert('Password salah.');
  return false;
}

  uploadStatusEl.textContent = 'Membaca file...';

  reader.onload = async () => {
    try{
      const text = reader.result;
      const records = isExcelXml(text) ? xlsXmlToRecords(text) : csvToRecords(text);
      if(records.length === 0){
        throw new Error('Tidak ada baris valid yang terbaca dari file ini.');

        localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
        localStorage.setItem(STORAGE_META_KEY, JSON.stringify({updatedAt, filename:file.name}));
      }catch(e){
        console.warn('Gagal menyimpan ke localStorage (mungkin data terlalu besar untuk browser ini).', e);
      }
      updateStats();
      rebuildFilters();
      rebuildAOFilter();
      render();

      uploadStatusEl.className = 'upload-status ok';

      uploadStatusEl.className = 'upload-status err';
    }

  };

});

/* ==== Bandingkan 2 file (data lama vs data baru) ==== */

function fileToRecords(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const text = reader.result;
        const records = isExcelXml(text) ? xlsXmlToRecords(text) : csvToRecords(text);
        if(records.length === 0){
          reject(new Error('Tidak ada baris valid yang terbaca dari file ini.'));
          return;
        }
        resolve(records);
      }catch(err){ reject(err); }
    };
    reader.onerror = () => reject(new Error('Gagal membaca file.'));
    reader.readAsText(file, 'utf-8');
  });
}

const compareOverlay = document.getElementById('compareOverlay');
const compareSheet = document.getElementById('compareSheet');
const compareBtn = document.getElementById('compareBtn');

function renderCompareForm(){
  compareSheet.innerHTML = `
    <div class="sheet-head">
      <button class="close" id="compareCloseBtn">✕</button>
      <h2>Bandingkan 2 file</h2>
      <div class="sub">Cari nasabah yang berubah status tagihan antar dua periode</div>
    </div>
    <div class="section">
      <div class="compare-upload">
        <label class="file-lbl" for="fileLama">Data lama (periode sebelumnya)</label>
        <input id="fileLama" type="file" accept=".csv,.txt,.xls,.xlsx,.xml">
        <div class="compare-filename" id="fileLamaName"></div>
      </div>
      <div class="compare-upload">
        <label class="file-lbl" for="fileBaru">Data baru (periode terkini)</label>
        <input id="fileBaru" type="file" accept=".csv,.txt,.xls,.xlsx,.xml">
        <div class="compare-filename" id="fileBaruName"></div>
      </div>
      <button id="runCompareBtn" class="compare-run-btn" type="button">Bandingkan</button>
      <div class="compare-status" id="compareStatus"></div>
    </div>
    <div id="compareResult"></div>
  `;
  document.getElementById('compareCloseBtn').addEventListener('click', closeCompare);
  const fileLamaInput = document.getElementById('fileLama');
  const fileBaruInput = document.getElementById('fileBaru');
  fileLamaInput.addEventListener('change', () => {
    document.getElementById('fileLamaName').textContent = fileLamaInput.files[0] ? fileLamaInput.files[0].name : '';
  });
  fileBaruInput.addEventListener('change', () => {
    document.getElementById('fileBaruName').textContent = fileBaruInput.files[0] ? fileBaruInput.files[0].name : '';
  });
  document.getElementById('runCompareBtn').addEventListener('click', runCompare);
}

function openCompare(){
  renderCompareForm();
  compareOverlay.classList.add('show');
}
function closeCompare(){
  compareOverlay.classList.remove('show');
}
compareBtn.addEventListener('click', async () => {
  const ok = await requirePassword();
  if(ok) openCompare();
});
compareOverlay.addEventListener('click', e => { if(e.target === compareOverlay) closeCompare(); });

async function runCompare(){
  const fileLama = document.getElementById('fileLama').files[0];
  const fileBaru = document.getElementById('fileBaru').files[0];
  const statusEl = document.getElementById('compareStatus');
  const runBtn = document.getElementById('runCompareBtn');
  if(!fileLama || !fileBaru){
    statusEl.textContent = 'Pilih kedua file (data lama dan data baru) terlebih dahulu.';
    statusEl.className = 'compare-status err';
    return;
  }
  runBtn.disabled = true;
  statusEl.textContent = 'Membaca dan membandingkan data...';
  statusEl.className = 'compare-status';
  try{
    const [recLama, recBaru] = await Promise.all([fileToRecords(fileLama), fileToRecords(fileBaru)]);
    const mapLama = new Map(recLama.map(d => [d.no_rekening, d]));
    const mapBaru = new Map(recBaru.map(d => [d.no_rekening, d]));

    const turunJadiBelum = []; // sebelumnya tertagih (sudah angsur), sekarang belum
    const naikJadiSudah = [];  // sebelumnya belum, sekarang sudah tertagih
    const hanyaDiBaru = [];    // nasabah baru, tidak ada di data lama
    const hanyaDiLama = [];    // ada di data lama, tidak muncul lagi di data baru (kemungkinan lunas/tutup)

    for(const [rek, dLama] of mapLama){
      const dBaru = mapBaru.get(rek);
      if(!dBaru){
        hanyaDiLama.push(dLama);
        continue;
      }
      if(dLama.sudah_angsur && !dBaru.sudah_angsur) turunJadiBelum.push(dBaru);
      if(!dLama.sudah_angsur && dBaru.sudah_angsur) naikJadiSudah.push(dBaru);
    }
    for(const [rek, dBaru] of mapBaru){
      if(!mapLama.has(rek)) hanyaDiBaru.push(dBaru);
    }

    renderCompareResult({turunJadiBelum, naikJadiSudah, hanyaDiBaru, hanyaDiLama, fileLama, fileBaru});
    statusEl.textContent = `✓ Selesai · ${recLama.length} data lama vs ${recBaru.length} data baru`;
    statusEl.className = 'compare-status ok';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Gagal membandingkan: ' + err.message;
    statusEl.className = 'compare-status err';
  }
  runBtn.disabled = false;
}

function compareItemHtml(d, cls){
  return `<div class="compare-item ${cls}">
    <div class="nm">${d.nama}</div>
    <div class="rek nums">${d.no_rekening} &middot; ${shortProduk(d.produk)}${d.ao ? ' &middot; AO: '+d.ao : ''}</div>
  </div>`;
}

function compareGroupHtml(title, list, cls){
  if(list.length === 0){
    return `<div class="compare-group-title">${title} (0)</div><div class="compare-empty">Tidak ada nasabah dalam kategori ini.</div>`;
  }
  return `<div class="compare-group-title">${title} (${list.length})</div>` +
    list.map(d => compareItemHtml(d, cls)).join('');
}

function renderCompareResult({turunJadiBelum, naikJadiSudah, hanyaDiBaru, hanyaDiLama}){
  const resultEl = document.getElementById('compareResult');
  resultEl.innerHTML = `
    <div class="section">
      <div class="compare-summary">
        <div class="compare-stat down"><b>${turunJadiBelum.length}</b><span>Dulu tertagih, kini belum</span></div>
        <div class="compare-stat up"><b>${naikJadiSudah.length}</b><span>Dulu belum, kini tertagih</span></div>
      </div>
      ${compareGroupHtml('Perlu perhatian: dulu tertagih, sekarang belum angsur', turunJadiBelum, 'down')}
      ${compareGroupHtml('Progres baik: dulu belum, sekarang sudah angsur', naikJadiSudah, 'up')}
      ${compareGroupHtml('Nasabah baru (hanya ada di data baru)', hanyaDiBaru, '')}
      ${compareGroupHtml('Tidak muncul lagi di data baru (kemungkinan lunas/tutup)', hanyaDiLama, '')}
    </div>
  `;
}
